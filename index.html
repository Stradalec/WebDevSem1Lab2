<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <title>To-Do</title>
  </head>
  <body>
    <header></header>
    <main class="main">
      <section class="input_row">
        <div class="input_column">
          <input type="text" placeholder="Title" />
          <input type="text" placeholder="About" />
        </div>
        <button id = "add" type="button" value="button" class="button_add">+</button>
      </section>
      <section class="no_task_window">
        <div></div>
        <p>Нет задач</p>
        <div></div>
      </section>
      <section class="dialog_window">
        <p>Удалить задачу?</p>
         <div class="input_row_close">
          <button id = "delete_confirm" type="button" value="button" class="button_dialog">
            Да
          </button>
          <button id = "delete_cancel" type="button" value="button" class="button_dialog">
            Нет
          </button>
        </div>
      </section>
      <section class="share_window">
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/copy.svg" alt="Удалить заметку" />
        </button>
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/vk.svg" alt="Поделиться" />
        </button>
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/telegram.svg" alt="Редактировать заметку" />
        </button>
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/whatsapp.svg" alt="Информация о заметке" />
        </button>
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/facebook.svg" alt="Поделиться заметкой" />
        </button>
      </section>
      </section>
    </main>
    <footer></footer>
    <script src="src/main.js"></script>
  </body>
</html>
