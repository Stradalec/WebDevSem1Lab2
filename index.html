<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <title>To-Do</title>
  </head>
  <body>
    <header></header>
    <main class="main">
      <section class="input_row">
        <div class="input_column">
          <input type="text" placeholder="Title" />
          <input type="text" placeholder="About" />
        </div>
        <button type="button" value="button" class="button_add">+</button>
      </section>
      <section class="edit_window">
        <input type="text" placeholder="Mini input" />
        <textarea placeholder="Max input"></textarea>
        <div class="input_row_close">
          <button type="button" value="button" class="button_dialog">
            Отменить
          </button>
          <button type="button" value="button" class="button_dialog">
            Сохранить
          </button>
        </div>
      </section>
      <section class="dialog_window">
        <p>Удалить задачу?</p>
         <div class="input_row_close">
          <button type="button" value="button" class="button_dialog">
            Да
          </button>
          <button type="button" value="button" class="button_dialog">
            Нет
          </button>
        </div>
      </section>
      <section class="input_row">
        <button type="button" value="button" class="button_task">
          <img src="assets/vector/delete.svg" alt="Удалить заметку" />
        </button>
        <button type="button" value="button" class="button_task">
          <img src="assets/vector/share.svg" alt="Поделиться" />
        </button>
        <button type="button" value="button" class="button_task">
          <img src="assets/vector/edit.svg" alt="Редактировать заметку" />
        </button>
        <button type="button" value="button" class="button_task">
          <img src="assets/vector/info.svg" alt="Информация о заметке" />
        </button>
      </section>
      <section class="share_window">
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/copy.svg" alt="Удалить заметку" />
        </button>
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/vk.svg" alt="Поделиться" />
        </button>
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/telegram.svg" alt="Редактировать заметку" />
        </button>
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/whatsapp.svg" alt="Информация о заметке" />
        </button>
        <button type="button" value="button" class="button_share">
          <img src="assets/vector/facebook.svg" alt="Информация о заметке" />
        </button>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
